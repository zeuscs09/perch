# ต้นทางเดียวของค่าคงที่ layout
# generate เป็น tools/gen/_layout_gen.py (Python) และ firmware/main/layout.h (C)
# ห้ามแก้ไฟล์ที่ generate ออกมา — แก้ที่นี่แล้วรัน `python3 tools/export_layout.py`

[screen]
width = 320
height = 240

[topbar]
height = 22
# ไอคอนลิงก์อยู่ขวาสุดของแถบ ของอื่นบนแถบเลื่อนมาซ้ายให้มัน — ตำแหน่งคงที่ ไม่ลอยตาม
# ความยาวนาฬิกา เพราะสิ่งที่ต้องหาเจอโดยไม่ต้องมองคือ "จอนี้ยังคุยกับ Mac อยู่ไหม"
link_icon_w = 11
link_icon_h = 9
link_icon_gap = 6

[slots]
# 3 ตัวคือจำนวนที่ยังให้มาสคอตตัวใหญ่พอมองจากอีกฝั่งห้องได้ (320 / 3 = 106.7)
count = 3
width = 106
# แถบมาสคอตนั่งต่ำ ไม่ชิดแถบบน — ที่ว่างเหนือหัวคือท้องฟ้า ไม่ใช่ที่เหลือ
# 49 ทำให้เส้นฝ่าเท้า (= เส้นขอบฟ้า) ตกที่ y=120 พอดี คือครึ่งจอ
top = 49
# แถบมาสคอตสูงพอดีตัว (67.2px) + baseline_pad ที่แบกป้ายชื่อ + ที่หายใจเหนือหัว 3px
height = 90
# กรอบวาด 23.9 x 16.8 unit -> 4px ต่อ unit = 95.6 x 67.2 px ใน slot 106px
# 4 คือค่าสูงสุดที่ยังวาง 3 ตัวเรียงได้ และ outline 0.34 unit ยังปัดเป็น 1px เท่าเดิม
unit_px = 4
# ระยะจากขอบล่างของ slot ถึงฝ่าเท้ามาสคอต
baseline_pad = 19

[card]
# เริ่มใต้ป้ายชื่อโปรเจกต์ (เส้นฝ่าเท้า 120 + ป้าย ~17px) ไม่ใช่ใต้เส้นขอบฟ้าทันที
top = 142
height = 98
pad = 6
# การ์ดสูงสุด 2 ใบ ไม่ใช่ 3 — ใบที่ 3 ดันแผงโควตา/นาฬิกาขึ้นมาชนป้ายชื่อ
# และของที่ต้องทำจริงๆ ไม่เคยมีพร้อมกันสามอย่างจนต้องเห็นหมดในเหลือบเดียว
max = 2

[usage]
# แผง utilization กินพื้นที่เดียวกับนาฬิกาใหญ่ — โผล่เมื่อไม่มี card และมีข้อมูลจริง
# สองชั้น: [เลข % + เวลารีเซ็ต + ป้ายหน้าต่าง] แล้วแถบ
# เวลารีเซ็ตอยู่บรรทัดเดียวกับเลข % ไม่ใช่ชั้นที่สาม — ประหยัด 16px ต่อแถว
# โดยไม่ต้องลดขนาดเลข % ซึ่งเป็นสิ่งเดียวที่ต้องอ่านออกจากอีกฝั่งห้อง
row_h = 40
gap = 4
bar_h = 7
# เรียงเป็นตาราง 2 คอลัมน์ ไม่ใช่ซ้อนลงมาแถวเดียว — พื้นที่มีแค่ 98px ถ้าซ้อน 4 แถว
# ต้องบีบความสูงแถวเหลือ ~21px ซึ่งเลข % ขนาด 24px ใส่ไม่ลง
# สองคอลัมน์เก็บความสูงแถวเดิมไว้ได้ทั้งหมด แลกกับความกว้างที่ยังพอวางแถบได้สบาย
cols = 2
gutter = 14
# จำนวนช่องทั้งหมด: [Claude 5h, Claude weekly, Codex, เครื่อง]
# อยู่ที่นี่เพราะทั้ง firmware และ preview ต้องเห็นตรงกัน — เคยนิยามแยกกันสองที่
rows = 4
# ความยาวหน้าต่างเป็นวินาที — ใช้คำนวณขีด pace (elapsed = window - remaining)
# ค่าคงที่ทั้งคู่ ไม่ได้ส่งมากับ snapshot
session_window = 18000
weekly_window = 604800
# ขั้นสี 3 ระดับ — มากกว่านี้แยกไม่ออกจากระยะโต๊ะ
warn_pct = 60
crit_pct = 85

[weather]
# ฝนวาดเป็นขีดเฉียงที่ตกลงมาแล้ววนกลับขึ้นไปใหม่ ไม่ใช่ particle จริง — จอ 320x240
# ที่ redraw ทั้งฟ้าทุกเฟรมไม่มีงบให้เก็บสถานะรายหยด และจากระยะโต๊ะแยกไม่ออกอยู่ดี
drops = 26
drop_len = 7
# เอียงไปทางขวาเล็กน้อย ฝนที่ตกดิ่ง 90 องศาอ่านเป็นเส้นตาราง ไม่ใช่สายฝน
drop_slant = 2
drop_speed_px_s = 150
# เมฆตอนฟ้าปิด/ฝน — ก้อนเดิม 3 ก้อนดูโล่งเกินกว่าจะอ่านว่าฟ้าปิด
overcast_clouds = 7
# ฟ้าแลบ: กะพริบสั้นมาก ห่างกันหลายวินาที ถ้าถี่กว่านี้กลายเป็นไฟดิสโก้
flash_every_s = 9.0
flash_hold_s = 0.12

[stroll]
# ไม่มี session เลย = แถบ slot ว่างทั้งแถบ ซึ่งดูเหมือนอุปกรณ์ค้าง
# แทนที่ด้วยมาสคอตเดินข้ามจอซ้าย -> ขวา แล้ววนใหม่ พร้อมหยุดทำท่าหนึ่งครั้งกลางทาง
speed_px_s = 34
# วินาทีที่หยุดทำท่า — สั้นกว่านี้ดูเหมือนสะดุด ยาวกว่านี้เหมือนค้าง
pause_s = 2.5
# ระยะพ้นขอบจอทั้งสองด้าน (px) — กว้างกว่ามาสคอต (90px) เพื่อให้เข้า/ออกสนิท
pad_px = 96

[sky]
# ฉากกินเต็มจอใต้แถบบน: ฟ้า 22..119 แล้วพื้นดินยาวลงไปถึงก้นจอ
# card วาดพื้นทึบของตัวเองอยู่แล้ว ส่วนแผงโควตา/นาฬิกาใหญ่วางตัวอักษรลงบนพื้นดินตรงๆ
# สีพื้นดินทุกช่วงจึงต้องเข้ม (luminance ~0.04) ไม่ใช่สีหญ้าจริง
# เส้นขอบฟ้า = เส้นฝ่าเท้าพอดี (slots.top + slots.height - slots.baseline_pad)
# เท้าแตะพื้น ไม่ลอย ไม่จม ส่วนป้ายชื่อโปรเจกต์ตกลงไปอยู่บนพื้นดินใต้เท้า
horizon = 120
# ขอบช่วงเวลา (ชั่วโมง) — ที่เหลือคือ night
# กระโดดที่ขอบ ไม่ผสมสี: dawn/dusk สั้นแค่ 2 ชม. จึงทำหน้าที่เป็นขั้นกลางให้เอง
dawn_hour = 5
day_hour = 7
dusk_hour = 17
night_hour = 19
# ดวงอาทิตย์เดินโค้ง 05:00->19:00 ดวงจันทร์ 19:00->05:00 — ตำแหน่งคือเวลาจริง
# ไม่ใช่ของประดับ เหลือบแล้วรู้คร่าวๆ ว่ากี่โมงโดยไม่ต้องอ่านตัวเลข
disc_r = 7
# ความสูงสุดของส่วนโค้งเหนือเส้นขอบฟ้า — 82 ทำให้จุดสูงสุดอยู่ที่ y=38
# ซึ่งยังอยู่ในแถบฟ้า (บนสุด 22) และขอบบนของดวง (38-7=31) ไม่ชนแถบบน
arc_peak = 82
# ระยะที่ดวงโผล่พ้นขอบจอทั้งสองข้าง — 0 คือขึ้น/ตกที่ขอบจอพอดี
# ลอง 24 แล้วพัง: ดวงอาทิตย์อยู่นอกจอตลอด 05:00-05:55 และ 18:05-19:00
# ซึ่งกินเวลาเกือบครึ่งของช่วง dawn/dusk ทั้งที่นั่นคือช่วงที่ต้องเห็นดวงติดขอบฟ้า
arc_pad = 0
# ตำแหน่งดาว (x, y) พิกเซลสัมบูรณ์ — 4 ดวงแรกกะพริบ ที่เหลือนิ่งตลอด
# กะพริบทุกดวงจะอ่านเป็นสัญญาณเตือน ไม่ใช่ท้องฟ้า
# ลำดับในตารางนี้ไม่ใช่ลำดับซ้าย->ขวา และห้ามเรียงใหม่ตาม x: ทั้ง twinkle_n และ
# low_star_n หยิบ "ดวงแรกๆ" ของตาราง ถ้าเรียงตาม x ดาวที่กะพริบจะกองอยู่ซ้ายจอ
# หกดวงแรกจึงถูกวางให้กระจายเต็มความกว้าง (x ≈ 33/128/205/289 แล้วค่อย 76/247)
stars = [
  [ 33, 63], [128, 67], [205, 88], [289, 48],
  [ 76, 27], [247, 71], [ 14, 33], [ 58, 82],
  [103, 44], [171, 90], [ 92, 99], [149, 37],
  [186, 52], [229, 30], [268,101], [307, 80],
]
twinkle_n = 4
# ขนาดปกติของดาว — 1px ยังอ่านออกบนแผงจริง ต่างจากก้านหญ้า 1px ที่หายไปเลย
# เพราะดาวสว่างสุดขั้วบนฟ้ากลางคืนที่เกือบดำ ไม่ใช่เขียวบนเขียว
star_px = 1
# ขั้นสว่างสุดของดวงที่กะพริบโตขึ้นเป็น 3x3 — แค่เปลี่ยนสีอย่างเดียวบนแผงจริง
# อ่านไม่ออกว่ากะพริบ ต้องเห็นดวงโตขึ้นด้วย แต่ 4x4 โตจนอ่านเป็นสี่เหลี่ยม ไม่ใช่ดาว
star_peak_px = 3
# ตอน dawn/dusk เห็นแค่ดาวดวงแรกๆ สีหรี่ ไม่กะพริบ — ฟ้ายังสว่างเกินกว่าจะเห็นทั้งหมด
low_star_n = 6
# เมฆ (x ตั้งต้น, y, กว้าง) — ลอยซ้าย->ขวา วนกลับ ไม่มีตอนกลางคืน
clouds = [[40, 44, 44], [150, 74, 36], [250, 32, 52]]
cloud_speed_px_s = 4
# กอหญ้าชี้ขึ้นไปในฟ้าจากเส้นขอบฟ้า ไม่ปูลงมาทั้งพื้น — พื้นล่างต้องเรียบและเข้ม
# เพราะแผงโควตา/นาฬิกาวางตัวอักษรทับอยู่
# ระยะห่างไม่เท่ากันเลย (5..28 px) — ระยะเท่ากันอ่านเป็นรั้วหรือลายพิมพ์ ไม่ใช่หญ้า
grass_x = [4, 13, 35, 41, 55, 62, 88, 99, 104, 123, 131, 155,
           168, 174, 191, 200, 228, 235, 247, 268, 273, 288, 298, 310]
# ระยะพ้นขอบจอที่เมฆใช้วนกลับ — กว้างกว่าเมฆก้อนใหญ่สุดเพื่อให้ออกสนิทก่อนโผล่ใหม่
cloud_pad = 60

[mascot]
# ตารางหน่วยมาตรฐานของมาสคอต (ไม่ใช่พิกเซล) — ซิลลูเอ็ตรวมแขนกว้าง 16.5 สูง 12
# = ตาราง 12 x 8 ช่องของภาพอ้างอิง ช่องละ 1.5 unit (ดู gen/mascot.py CELL) โดยแขนสั้นลง
# เหลือข้างละ 1.5 ช่อง · ที่เหลือทางขวาถึง x=23.4 สงวนไว้ให้ prop ที่ถือ ไม่ให้ทับลำตัว
grid_w = 16.5
grid_h = 12
# รัศมีมุมของชิ้นซิลลูเอ็ต (unit) — 0.25 unit = 1px ที่ unit_px = 4
# 0.5 (2px) ลองแล้วมนเกิน: ส่วนของแขนที่โผล่พ้นลำตัวกว้างแค่ 1.5 unit = 6px
# รัศมี 2px ทั้งสองมุมจึงกินไป 4 ใน 6 px แล้วแขนอ่านเป็นแคปซูล ไม่ใช่เหลี่ยมที่ลบมุม
# ตากับ prop ไม่ใช้ค่านี้ — คมทั้งคู่ตามภาพอ้างอิง
corner = 0.25

[palette]
bg          = "#14100E"
bg_slot     = "#1B1613"
clay        = "#D97757"
clay_dark   = "#A85639"
clay_sleep  = "#7A4630"
gray        = "#5C5C5C"
gray_dark   = "#3D3D3D"
ink         = "#17140F"
outline     = "#FFFFFF"
text        = "#E8E0D8"
text_dim    = "#8A817A"
accent      = "#E8B84B"
# ส้มอำพัน — ด้านเงาของหมวกวิศวกร เข้มพอให้เห็นเป็นปริมาตร แต่ยังสว่างและอิ่มตัว
# (ถ้าใช้สีน้ำตาล/ดำเป็นเงา หมวกจะอ่านเป็นสองชิ้นแยกกันแทนที่จะเป็นก้อนเดียวที่โดนแสง
#  ต้องอมเหลืองไว้ ถ้าไล่ไปทางส้มแดงจนใกล้สีดินของลำตัว ปีกหมวกจะกลืนหายไปกับหัว)
accent_warm = "#D99420"
glass       = "#A8D8EA"  # กระจกเลนส์แว่นขยาย — ฟ้าอ่อน ตัดกับตัวสีดินและตาสีหมึก
steel       = "#54748A"  # กรอบแว่น — ฟ้าเทา เข้มกว่ากระจกพอให้เห็นเป็นวงแหวน
alert       = "#D9564F"
good        = "#5FA85F"
# สีลำตัวมาสคอตต่อเอเจนต์ — ชุดละ 3 เฉด ให้ตรงกับ clay/clay_dark/clay_sleep ของ Claude
# เพราะการเปลี่ยนสีทำด้วยการ map ทีละเฉด ไม่ได้วาดมาสคอตใหม่
#
# เลือกจากระยะโต๊ะ: ต้องแยกออกจากกันได้ในเหลือบเดียวโดยไม่ต้องอ่านป้ายชื่อ จึงเอา
# คนละวงศ์สีไปเลย (ส้ม / ฟ้า / ม่วง) ไม่ใช่ส้มสามเฉด และต้องไม่ชนกับ good (เขียว)
# กับ alert (แดง) ซึ่งกินความหมาย "สถานะ" ไปแล้ว
# สภาพอากาศ — ฟ้าตอนปิด/ฝนต้องหม่นกว่าฟ้าปกติของ phase นั้นชัดเจน แต่ห้ามมืดจน
# มาสคอตจมหาย เส้นฝนจึงต้องสว่างกว่าฟ้าที่มันตกผ่าน ไม่ใช่สีน้ำเงินเข้ม
sky_overcast   = "#6E7A85"
sky_storm      = "#3E464F"
rain           = "#9FC4DC"
lightning      = "#FFF6D8"
fog            = "#9AA3A8"
codex        = "#4FA8C7"
codex_dark   = "#35768C"
codex_sleep  = "#2A4E5C"
antigrav       = "#8B7FD9"
antigrav_dark  = "#6154A8"
antigrav_sleep = "#443B6E"
# ท้องฟ้า — กลางวันต้องข้ามความสว่างของมาสคอตไปให้พ้น ไม่ใช่หยุดกลางทาง
# มาสคอตสีดิน #D97757 อยู่ที่ luminance 0.27 พอดี ฟ้าที่สว่างใกล้ค่านั้น (#7FB4D9
# = 0.43) จึงได้ contrast แค่ 1.5:1 ซึ่งแย่กว่าฟ้าเข้ม กราฟ contrast มีก้นบึ้งตรงนั้น
# #B8DCF5 (0.67) ได้ 2.2:1 เท่ากับฟ้าน้ำเงินเข้มที่เคยลอง แต่เป็นกลางวันจริง
# dawn กับ dusk ต้องอยู่คนละวงศ์สี ไม่ใช่ม่วงเหมือนกันคนละความสว่าง — ทั้งคู่กินเวลา
# ช่วงละ 2 ชม. และไม่มีวันเห็นพร้อมกัน ตัวแยกจึงต้องเป็นสีล้วนๆ ไม่มีบริบทอื่นช่วย
# เช้า = น้ำเงินคราม (ฟ้ายังเย็น แดดยังไม่ถึง) · เย็น = ม่วง
# เย็นเคยเป็นแดงอมม่วง #7E3A55 (hue 336) แล้วกลืนกับตัวมาสคอตสีดิน (hue 17) เพราะ
# ห่างกันแค่ 41 องศา — contrast 2.6:1 ที่ผ่านเกณฑ์ตัวเลขไม่ช่วยเมื่อสองสีอยู่วงศ์เดียวกัน
# #6B2C7A (hue 288) ห่างออกไป 89 องศาและได้ 3.0:1 ด้วย ทั้งคู่ยังต่างจาก dawn ชัด:
# dawn สว่างกว่า (L 0.072 vs 0.063) และเย็นกว่า (hue 227 vs 288)
sky_night    = "#0B0F1A"
sky_dawn     = "#3A4A7A"
sky_day      = "#B8DCF5"
sky_dusk     = "#6B2C7A"
# พื้นดินเปลี่ยนคู่กับฟ้า — ป้ายชื่อโปรเจกต์นั่งอยู่บนนี้ ทุกสีจึงต้องเข้มพอให้
# ตัวอักษรสี text (#E8E0D8) อ่านออกโดยไม่ต้องสลับสีข้อความตามช่วงเวลา
ground_night = "#14181C"
ground_dawn  = "#1C2430"
ground_day   = "#2B3A2E"
ground_dusk  = "#261A2E"
# ดวงอาทิตย์อมส้มมากกว่าเหลืองอ่อน — บนฟ้ากลางวันที่สว่างแล้ว สีเหลืองอ่อนจางจนหาย
sun          = "#F5A62A"
# ดวงใกล้ขอบฟ้าอมแดง — ตอน dawn/dusk ถ้าใช้สีเหลืองเดิมจะอ่านเป็นเที่ยงวันดวงเตี้ย
sun_low      = "#E8834B"
moon         = "#C8CEDA"
star         = "#E8E0D8"
# สามระดับ ไม่ใช่สองระดับ — ดาวกะพริบไล่ dim -> mid -> star -> mid
# สลับสองระดับตรงๆ อ่านเป็นไฟกะพริบ ไม่ใช่ดาวส่องแสง
star_mid     = "#A6ADB8"
star_dim     = "#6E7A8A"
# เมฆกลางวันต้องสว่างกว่าฟ้า ไม่ใช่เข้มกว่า — ฟ้าเป็นสีอ่อนแล้ว เมฆสีเข้มอ่านเป็นเงา
cloud_day    = "#F2F9FF"
# เมฆแยกตาม dawn/dusk ด้วย ไม่ใช้สีร่วม — ถ้าเมฆสีเดียวกันจะดึงสองช่วงกลับมาเหมือนกันอีก
cloud_dawn   = "#5E6E9E"
cloud_dusk   = "#C06B96"
# หญ้าเป็นสีเดียวที่สว่างกว่าพื้นดินได้ เพราะเป็นกอเล็กๆ เกาะเส้นขอบฟ้า ไม่ใช่ผืนพื้น
# ถ้าเอาสีนี้ไปทาพื้นทั้งผืน ตัวเลข % สีเขียวบนแผงโควตาจะจมหายไปกับพื้น
grass_night  = "#2E4038"
grass_dawn   = "#33503F"
grass_day    = "#6FA85F"
grass_dusk   = "#5A5238"
# เงาใต้เท้า — ทำให้ท่ากระโดด (celebrate ยกเท้า 5px) อ่านเป็นกระโดด ไม่ใช่ลอย
# แยกสีตามช่วงเหมือนพื้นดิน ไม่ใช่สีดำสีเดียว: สีเดียวที่เข้มพอสำหรับพื้นกลางคืน
# จะกลายเป็นรูดำบนพื้นกลางวัน แต่ละสีคือพื้นของช่วงนั้นหรี่ลงประมาณ 45%
shadow_night = "#0B0E11"
shadow_dawn  = "#12171F"
shadow_day   = "#1B251E"
shadow_dusk  = "#1A1220"
